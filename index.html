<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod Settings - Animatronic Skins</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="game-shell">

    <!-- Left sidebar -->
    <aside class="sidebar">
      <div class="sidebar-controls">

        <h1 class="sidebar-title">MOD SETTINGS</h1>
        <p class="sidebar-subtitle">ANIMATRONIC SKINS</p>

        <div class="search-wrap">
          <label for="search">SEARCH</label>
          <input
            id="search"
            type="search"
            placeholder="Character or mod..."
            autocomplete="off"
          >
        </div>

        <section class="completion-panel">
          <div class="completion-title">SKIN COMPLETION</div>
          <div id="completion-percent" class="completion-percent">0%</div>
          <div class="completion-count">
            <span id="completion-count">0</span> / 87 CHARACTERS
          </div>
        </section>

        <label class="toggle">
          <input id="show-all" type="checkbox" checked>
          <span class="toggle-box"></span>
          <span class="toggle-text">SHOW ALL CHARACTERS</span>
        </label>

        <div class="sidebar-note">
          <span id="visible-count">87</span> CHARACTERS DISPLAYED
        </div>

      </div>
    </aside>

    <!-- Character and mod list -->
    <section class="content-panel">
      <div id="character-list" class="character-list">
        <p class="loading-message">LOADING CHARACTERS...</p>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
